<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Fictional customer search journey</title>
  <desc id="desc">Search customers, distinguish matching results from the no-results state, open a result, view customer detail, handle unknown IDs, and optionally edit, save, or cancel. Source-confirmed only; not runtime-tested.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .node { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .state { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .branch { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
      .head { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .legend { font: 13px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="650" fill="#ffffff"/>
  <text x="40" y="38" class="head">Customer Search → Customer Detail</text>
  <text x="40" y="62" class="small">Illustrative source analysis · no runtime verification · fictional data</text>

  <rect class="node" x="60" y="110" width="250" height="115"/>
  <text x="185" y="140" text-anchor="middle" class="label">SCR-001 · Customer Search</text>
  <text x="185" y="165" text-anchor="middle" class="small">Enter name or email</text>
  <text x="185" y="186" text-anchor="middle" class="small">Activate Search</text>
  <text x="185" y="207" text-anchor="middle" class="small">Route: /customers</text>

  <polygon class="branch" points="440,132 520,168 440,204 360,168"/>
  <text x="440" y="163" text-anchor="middle" class="small">Matches?</text>
  <text x="440" y="180" text-anchor="middle" class="small">source logic</text>

  <rect class="state" x="575" y="95" width="225" height="85"/>
  <text x="687" y="125" text-anchor="middle" class="label">SCR-001 · Results state</text>
  <text x="687" y="147" text-anchor="middle" class="small">Customer links shown</text>

  <rect class="state" x="575" y="215" width="225" height="85"/>
  <text x="687" y="245" text-anchor="middle" class="label">SCR-005 · No-results state</text>
  <text x="687" y="267" text-anchor="middle" class="small">Same /customers route; form remains</text>

  <rect class="node" x="845" y="95" width="225" height="105"/>
  <text x="957" y="124" text-anchor="middle" class="label">SCR-002 · Customer Detail</text>
  <text x="957" y="147" text-anchor="middle" class="small">Route: /customers/:id</text>
  <text x="957" y="170" text-anchor="middle" class="small">View current values</text>

  <rect class="state" x="845" y="260" width="225" height="95"/>
  <text x="957" y="290" text-anchor="middle" class="label">Edit state</text>
  <text x="957" y="313" text-anchor="middle" class="small">Edit opens form</text>
  <text x="957" y="333" text-anchor="middle" class="small">Same route, local state</text>

  <rect class="state" x="575" y="380" width="225" height="95"/>
  <text x="687" y="410" text-anchor="middle" class="label">Save</text>
  <text x="687" y="433" text-anchor="middle" class="small">Update in-memory store</text>
  <text x="687" y="453" text-anchor="middle" class="small">Show saved status</text>

  <rect class="state" x="845" y="405" width="225" height="95"/>
  <text x="957" y="435" text-anchor="middle" class="label">Cancel</text>
  <text x="957" y="458" text-anchor="middle" class="small">Discard draft changes</text>
  <text x="957" y="478" text-anchor="middle" class="small">Return to detail view</text>

  <rect class="branch" x="60" y="355" width="250" height="90" rx="12"/>
  <text x="185" y="386" text-anchor="middle" class="label">SCR-003 · Not Found</text>
  <text x="185" y="409" text-anchor="middle" class="small">Unknown customer ID</text>
  <text x="185" y="429" text-anchor="middle" class="small">Same detail route pattern</text>

  <path class="edge" d="M310 168 L358 168"/>
  <path class="edge" d="M520 155 L550 137 L573 137"/>
  <text x="534" y="120" class="small">Yes</text>
  <path class="edge" d="M440 204 L440 257 L573 257"/>
  <path class="edge dashed" d="M575 285 L535 330 L315 330 L315 225"/>
  <text x="380" y="323" class="small">Search again</text>
  <text x="456" y="238" class="small">No</text>
  <path class="edge" d="M800 137 L843 137"/>
  <text x="802" y="121" class="small">Click result</text>
  <path class="edge dashed" d="M845 177 L805 177 L805 316 L310 316 L310 355"/>
  <text x="520" y="307" class="small">Unknown ID direct route</text>
  <path class="edge" d="M957 200 L957 258"/>
  <text x="968" y="233" class="small">Edit</text>
  <path class="edge" d="M845 308 L800 308 L800 405"/>
  <text x="805" y="292" class="small">Save</text>
  <path class="edge" d="M957 355 L957 403"/>
  <text x="968" y="383" class="small">Cancel</text>
  <path class="edge" d="M687 380 L687 337 L844 337"/>
  <text x="698" y="329" class="small">Saved → detail view</text>

  <rect x="40" y="540" width="1040" height="70" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <line x1="62" y1="563" x2="105" y2="563" class="edge"/>
  <text x="116" y="568" class="legend">Source-confirmed flow (not runtime-tested)</text>
  <line x1="435" y1="563" x2="478" y2="563" class="edge dashed"/>
  <text x="489" y="568" class="legend">Conditional / direct-route case to validate</text>
  <text x="62" y="592" class="legend">No API calls are implemented in this sample. Save is in-memory only; refresh persistence is not supported.</text>
</svg>