<rect x="309" y="486" width="120" height="50" rx="7" fill="#fff" stroke="#c8d2df" stroke-width="1.5"/>
<text class="font ink" x="369" y="517" text-anchor="middle" font-size="15" font-weight="700">Cancel</text>
<text class="font muted" x="120" y="710" font-size="13">Illustrative layout from JSX structure · not runtime-captured · styling is schematic</text>
