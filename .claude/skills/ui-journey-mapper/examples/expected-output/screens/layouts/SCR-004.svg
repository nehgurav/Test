<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">SCR-004 Edit Customer — screen layout</title>
<desc id="desc">Source-reconstructed edit form state with name and email inputs, Save changes and Cancel controls. The visual style is schematic, not a browser screenshot.</desc>
<defs><style>.bg{fill:#f5f7fa}.paper{fill:#fff;stroke:#d9e0e8;stroke-width:1.5}.ink{fill:#17212f}.muted{fill:#617085}.field{fill:#fff;stroke:#c8d2df;stroke-width:1.5}.line{stroke:#e1e6ed;stroke-width:1.2}.primary{fill:#315ee7}.white{fill:#fff}.font{font-family:Arial,Helvetica,sans-serif}</style></defs>
<rect class="bg" width="1280" height="820"/>
<rect class="paper" x="72" y="54" width="1136" height="710" rx="12"/>
<text class="font" x="120" y="112" font-size="16" fill="#315ee7" font-weight="700">‹  Back to search</text>
<text class="font ink" x="120" y="178" font-size="33" font-weight="700">Edit customer</text>
<text class="font muted" x="120" y="211" font-size="16">Update customer details.</text>
<text class="font ink" x="120" y="274" font-size="15" font-weight="700">Name</text>
