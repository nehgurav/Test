<title id="title">SCR-001 Customer Search — screen layout</title>
<desc id="desc">Source-reconstructed screen layout. Shows a Customer search heading, a name or email input, Search button, and two customer result links. The sample source has no CSS, so the visual styling is schematic and is not a browser screenshot.</desc>
